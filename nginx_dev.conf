# Nginx 配置 - dev.orcaspace.woa.com
# 
# 使用方法:
#   1. 复制到服务器: /etc/nginx/conf.d/discourse_dev.conf
#   2. 重载 Nginx: sudo nginx -t && sudo systemctl reload nginx
#
# SSL 证书路径需要根据实际情况修改

upstream discourse_dev {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name dev.orcaspace.woa.com;
    
    # HTTP 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.orcaspace.woa.com;

    # ========================================
    # SSL 证书配置（泛域名证书 *.orcaspace.woa.com）
    # ========================================
    ssl_certificate     /root/orcaspaces/ssl/orcaspace.woa.com.crt;
    ssl_certificate_key /root/orcaspaces/ssl/orcaspace.woa.com.key;
    
    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ========================================
    # 基础配置
    # ========================================
    root /root/orcaspaces/public;
    
    # 上传文件大小限制
    client_max_body_size 100m;
    
    # 超时配置
    proxy_connect_timeout 180;
    proxy_send_timeout 180;
    proxy_read_timeout 180;
    send_timeout 180;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_proxied any;

    # ========================================
    # 日志配置
    # ========================================
    access_log /var/log/nginx/discourse_dev_access.log;
    error_log /var/log/nginx/discourse_dev_error.log;

    # ========================================
    # 静态文件处理
    # ========================================
    location ~ ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        
        # 尝试本地文件，失败则代理到 Rails
        try_files $uri @discourse;
    }

    location ~ ^/uploads/ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri @discourse;
    }

    location ~ ^/images/ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri @discourse;
    }

    location ~ ^/plugins/ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri @discourse;
    }

    # ========================================
    # WebSocket 支持 (Message Bus)
    # ========================================
    location /message-bus/ {
        proxy_pass http://discourse_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_buffering off;
        proxy_redirect off;
    }

    # ========================================
    # 主代理配置
    # ========================================
    location / {
        try_files $uri @discourse;
    }

    location @discourse {
        proxy_pass http://discourse_dev;
        proxy_http_version 1.1;
        
        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 禁用缓冲以支持流式响应
        proxy_buffering off;
        proxy_redirect off;
        
        # 超时
        proxy_connect_timeout 180;
        proxy_send_timeout 180;
        proxy_read_timeout 180;
    }

    # ========================================
    # 健康检查端点
    # ========================================
    location /srv/status {
        proxy_pass http://discourse_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
